<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <linearGradient id="towerStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#64748b" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="redAccentStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#d32f2f" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cableStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#94a3b8" stop-opacity="0.10" />
      <stop offset="65%" stop-color="#94a3b8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.22" />
    </linearGradient>
    <pattern id="techGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#94a3b8" stroke-width="0.6" stroke-opacity="0.08" />
      <circle cx="80" cy="80" r="1.2" fill="#d32f2f" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Subtle Technical Blueprint Grid -->
  <rect width="1920" height="1080" fill="url(#techGrid)" />

  <!-- ================= LEFT HIGH-VOLTAGE TRANSMISSION TOWER (HAECO STYLE) ================= -->
  <g stroke="url(#towerStroke)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Left Tower Legs -->
    <line x1="160" y1="110" x2="70" y2="980" stroke-width="2.2" />
    <line x1="160" y1="110" x2="250" y2="980" stroke-width="2.2" />
    <line x1="138" y1="260" x2="96" y2="980" stroke-width="1.2" />
    <line x1="182" y1="260" x2="224" y2="980" stroke-width="1.2" />

    <!-- Tower Peak -->
    <polygon points="160,65 142,150 178,150" />
    <line x1="160" y1="40" x2="160" y2="150" stroke="url(#redAccentStroke)" stroke-width="1.8" />

    <!-- Top Cross Arm (Tier 1) -->
    <polygon points="65,205 160,165 255,205" />
    <line x1="45" y1="205" x2="275" y2="205" stroke-width="2" />
    <line x1="95" y1="192" x2="144" y2="205" />
    <line x1="225" y1="192" x2="176" y2="205" />
    <!-- Insulators Tier 1 -->
    <line x1="52" y1="205" x2="52" y2="238" stroke="url(#redAccentStroke)" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="268" y1="205" x2="268" y2="238" stroke="url(#redAccentStroke)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Middle Cross Arm (Tier 2 - Wide) -->
    <polygon points="22,315 160,260 298,315" />
    <line x1="10" y1="315" x2="310" y2="315" stroke-width="2.2" />
    <line x1="65" y1="298" x2="132" y2="315" />
    <line x1="255" y1="298" x2="188" y2="315" />
    <!-- Insulators Tier 2 -->
    <line x1="18" y1="315" x2="18" y2="352" stroke="url(#redAccentStroke)" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="302" y1="315" x2="302" y2="352" stroke="url(#redAccentStroke)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Lower Cross Arm (Tier 3 - Extra Wide) -->
    <polygon points="-10,435 160,375 330,435" />
    <line x1="-15" y1="435" x2="335" y2="435" stroke-width="2.2" />
    <line x1="48" y1="415" x2="122" y2="435" />
    <line x1="272" y1="415" x2="198" y2="435" />
    <!-- Insulators Tier 3 -->
    <line x1="325" y1="435" x2="325" y2="474" stroke="url(#redAccentStroke)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Lattice X-Bracing all the way down the tower -->
    <line x1="142" y1="150" x2="175" y2="205" />
    <line x1="178" y1="150" x2="145" y2="205" />
    <line x1="145" y1="205" x2="182" y2="260" />
    <line x1="175" y1="205" x2="138" y2="260" />
    <line x1="138" y1="260" x2="188" y2="315" />
    <line x1="182" y1="260" x2="132" y2="315" />
    <line x1="132" y1="315" x2="195" y2="375" />
    <line x1="188" y1="315" x2="125" y2="375" />
    <line x1="125" y1="375" x2="202" y2="435" />
    <line x1="195" y1="375" x2="118" y2="435" />

    <!-- Lower Body Lattice -->
    <line x1="118" y1="435" x2="210" y2="515" />
    <line x1="202" y1="435" x2="110" y2="515" />
    <line x1="110" y1="515" x2="210" y2="515" />

    <line x1="110" y1="515" x2="218" y2="600" />
    <line x1="210" y1="515" x2="102" y2="600" />
    <line x1="102" y1="600" x2="218" y2="600" />

    <line x1="102" y1="600" x2="226" y2="690" />
    <line x1="218" y1="600" x2="94" y2="690" />
    <line x1="94" y1="690" x2="226" y2="690" />

    <line x1="94" y1="690" x2="234" y2="785" />
    <line x1="226" y1="690" x2="86" y2="785" />
    <line x1="86" y1="785" x2="234" y2="785" />

    <line x1="86" y1="785" x2="242" y2="880" />
    <line x1="234" y1="785" x2="78" y2="880" />
    <line x1="78" y1="880" x2="242" y2="880" />

    <line x1="78" y1="880" x2="250" y2="980" />
    <line x1="242" y1="880" x2="70" y2="980" />
  </g>

  <!-- Secondary Distant Pylon (Left-Center Background) -->
  <g stroke="url(#towerStroke)" stroke-width="1" opacity="0.65">
    <line x1="410" y1="420" x2="368" y2="980" />
    <line x1="410" y1="420" x2="452" y2="980" />
    <line x1="355" y1="470" x2="465" y2="470" />
    <line x1="340" y1="535" x2="480" y2="535" />
    <line x1="330" y1="600" x2="490" y2="600" />
    <line x1="395" y1="470" x2="428" y2="535" />
    <line x1="425" y1="470" x2="392" y2="535" />
    <line x1="392" y1="535" x2="432" y2="600" />
    <line x1="428" y1="535" x2="388" y2="600" />
    <line x1="388" y1="600" x2="438" y2="690" />
    <line x1="432" y1="600" x2="382" y2="690" />
    <line x1="382" y1="690" x2="444" y2="790" />
    <line x1="438" y1="690" x2="376" y2="790" />
    <line x1="376" y1="790" x2="452" y2="980" />
    <line x1="444" y1="790" x2="368" y2="980" />
  </g>

  <!-- ================= RIGHT SIDE: INDUSTRIAL BUILDINGS, SUBSTATION & TOWER ================= -->
  <g stroke="url(#towerStroke)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- High-Rise Modern Building 1 -->
    <rect x="1560" y="340" width="115" height="640" />
    <line x1="1580" y1="310" x2="1655" y2="310" />
    <line x1="1580" y1="310" x2="1580" y2="340" />
    <line x1="1655" y1="310" x2="1655" y2="340" />
    <line x1="1618" y1="245" x2="1618" y2="310" stroke="url(#redAccentStroke)" stroke-width="1.8" />
    <!-- Building Windows Grid -->
    <line x1="1585" y1="370" x2="1585" y2="950" stroke-width="0.9" stroke-dasharray="14 10" />
    <line x1="1608" y1="370" x2="1608" y2="950" stroke-width="0.9" stroke-dasharray="14 10" />
    <line x1="1630" y1="370" x2="1630" y2="950" stroke-width="0.9" stroke-dasharray="14 10" />
    <line x1="1652" y1="370" x2="1652" y2="950" stroke-width="0.9" stroke-dasharray="14 10" />

    <!-- Building 2 (Stepped Commercial Tower) -->
    <rect x="1695" y="450" width="95" height="530" />
    <rect x="1712" y="405" width="60" height="45" />
    <line x1="1715" y1="480" x2="1770" y2="480" />
    <line x1="1715" y1="515" x2="1770" y2="515" />
    <line x1="1715" y1="550" x2="1770" y2="550" />
    <line x1="1715" y1="585" x2="1770" y2="585" />
    <line x1="1715" y1="620" x2="1770" y2="620" />
    <line x1="1715" y1="655" x2="1770" y2="655" />
    <line x1="1715" y1="690" x2="1770" y2="690" />
    <line x1="1715" y1="725" x2="1770" y2="725" />

    <!-- Industrial Factory with Sawtooth Roof & Substation -->
    <polygon points="1350,980 1350,760 1405,715 1405,760 1460,715 1460,760 1515,715 1515,980" />
    <rect x="1375" y="810" width="45" height="55" />
    <rect x="1445" y="810" width="45" height="55" />

    <!-- Right-Edge High Voltage Tower -->
    <line x1="1845" y1="160" x2="1775" y2="980" stroke-width="2" />
    <line x1="1845" y1="160" x2="1915" y2="980" stroke-width="2" />
    <line x1="1755" y1="245" x2="1935" y2="245" stroke-width="1.8" />
    <line x1="1725" y1="350" x2="1950" y2="350" stroke-width="1.8" />
    <line x1="1705" y1="455" x2="1960" y2="455" stroke-width="1.8" />
    <line x1="1828" y1="245" x2="1868" y2="350" />
    <line x1="1862" y1="245" x2="1822" y2="350" />
    <line x1="1822" y1="350" x2="1875" y2="455" />
    <line x1="1868" y1="350" x2="1815" y2="455" />
    <line x1="1815" y1="455" x2="1885" y2="575" />
    <line x1="1875" y1="455" x2="1805" y2="575" />
    <line x1="1805" y1="575" x2="1895" y2="710" />
    <line x1="1885" y1="575" x2="1795" y2="710" />
    <line x1="1795" y1="710" x2="1905" y2="850" />
    <line x1="1895" y1="710" x2="1785" y2="850" />
  </g>

  <!-- ================= POWER TRANSMISSION CABLES (CATENARY CURVES) ================= -->
  <path d="M 268 238 Q 340 390 465 470" stroke="url(#cableStroke)" stroke-width="1.3" fill="none" />
  <path d="M 302 352 Q 360 470 480 535" stroke="url(#cableStroke)" stroke-width="1.3" fill="none" />
  <path d="M 325 474 Q 380 555 490 600" stroke="url(#cableStroke)" stroke-width="1.3" fill="none" />
  <path d="M 465 470 Q 1100 680 1755 245" stroke="url(#cableStroke)" stroke-width="1" stroke-dasharray="8 6" fill="none" />
  <path d="M 480 535 Q 1120 740 1725 350" stroke="url(#cableStroke)" stroke-width="1" stroke-dasharray="8 6" fill="none" />

  <!-- Ground Horizon Line -->
  <line x1="0" y1="980" x2="1920" y2="980" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.45" />
</svg>
